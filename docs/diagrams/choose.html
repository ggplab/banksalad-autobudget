<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>banksalad-autobudget — 환경별 선택</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#f6f5f4; --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
    body { font-family: var(--sans); background: var(--paper); padding: 2rem; }
    .frame { max-width: 1000px; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
<div class="frame">
<svg viewBox="0 0 1000 840" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6b6b"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2B4AC6"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f6f5f4"/>

  <!-- ── connectors first ── -->
  <!-- D1 bottom (500,128) → three boxes at y=200 -->
  <path d="M500,128 V152 a8,8 0 0 1 -8,8 H168 a8,8 0 0 0 -8,8 V192" fill="none" stroke="#6b6b6b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="500" y1="128" x2="500" y2="192" stroke="#6b6b6b" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M500,128 V152 a8,8 0 0 0 8,8 H832 a8,8 0 0 1 8,8 V192" fill="none" stroke="#6b6b6b" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- row1 bottoms (y=296) → merge line y=344 → D2 top (500,352) -->
  <path d="M160,296 V336 a8,8 0 0 0 8,8 H492" fill="none" stroke="#6b6b6b" stroke-width="1"/>
  <line x1="500" y1="296" x2="500" y2="344" stroke="#6b6b6b" stroke-width="1"/>
  <path d="M840,296 V336 a8,8 0 0 1 -8,8 H508" fill="none" stroke="#6b6b6b" stroke-width="1"/>
  <line x1="500" y1="344" x2="500" y2="352" stroke="#6b6b6b" stroke-width="1"/>
  <!-- D2 bottom (500,448) → three boxes y=520 -->
  <path d="M500,448 V472 a8,8 0 0 1 -8,8 H168 a8,8 0 0 0 -8,8 V512" fill="none" stroke="#6b6b6b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="500" y1="448" x2="500" y2="512" stroke="#6b6b6b" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M500,448 V472 a8,8 0 0 0 8,8 H832 a8,8 0 0 1 8,8 V512" fill="none" stroke="#6b6b6b" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- row2 bottoms (y=616) → merge y=664 → end box top (500,712) -->
  <path d="M160,616 V656 a8,8 0 0 0 8,8 H492" fill="none" stroke="#6b6b6b" stroke-width="1"/>
  <line x1="500" y1="616" x2="500" y2="664" stroke="#6b6b6b" stroke-width="1"/>
  <path d="M840,616 V656 a8,8 0 0 1 -8,8 H508" fill="none" stroke="#6b6b6b" stroke-width="1"/>
  <line x1="500" y1="664" x2="500" y2="704" stroke="#2B4AC6" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- branch labels (masked, 8px above the horizontal run) -->
  <rect x="280" y="128" width="112" height="22" rx="2" fill="#f6f5f4"/>
  <text x="336" y="144" fill="#6b6b6b" font-size="16" text-anchor="middle">노트북, 가끔</text>
  <rect x="612" y="128" width="112" height="22" rx="2" fill="#f6f5f4"/>
  <text x="668" y="144" fill="#6b6b6b" font-size="16" text-anchor="middle">서버, n8n 없이</text>
  <rect x="512" y="164" width="88" height="22" rx="2" fill="#f6f5f4"/>
  <text x="556" y="180" fill="#6b6b6b" font-size="16" text-anchor="middle">서버 + n8n</text>

  <rect x="264" y="448" width="144" height="22" rx="2" fill="#f6f5f4"/>
  <text x="336" y="464" fill="#6b6b6b" font-size="16" text-anchor="middle">코딩 에이전트 있음</text>
  <rect x="600" y="448" width="136" height="22" rx="2" fill="#f6f5f4"/>
  <text x="668" y="464" fill="#6b6b6b" font-size="16" text-anchor="middle">둘 다 없음</text>
  <rect x="512" y="484" width="104" height="22" rx="2" fill="#f6f5f4"/>
  <text x="564" y="500" fill="#6b6b6b" font-size="16" text-anchor="middle">API 키 있음</text>

  <!-- merge dots -->
  <circle cx="500" cy="344" r="4" fill="#1a1a1a"/>
  <circle cx="500" cy="664" r="4" fill="#1a1a1a"/>

  <!-- D1 diamond -->
  <polygon points="500,32 600,80 500,128 400,80" fill="#f6f5f4"/>
  <polygon points="500,32 600,80 500,128 400,80" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="500" y="88" fill="#1a1a1a" font-size="24" font-weight="700" text-anchor="middle">어디서 돌리나?</text>

  <!-- row1 boxes -->
  <rect x="40" y="200" width="240" height="96" rx="6" fill="#f6f5f4"/>
  <rect x="40" y="200" width="240" height="96" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="160" y="240" fill="#1a1a1a" font-size="24" font-weight="700" text-anchor="middle">파일 드롭</text>
  <text x="160" y="272" fill="#6b6b6b" font-size="16" text-anchor="middle">pipeline.py run --file</text>

  <rect x="380" y="200" width="240" height="96" rx="6" fill="#f6f5f4"/>
  <rect x="380" y="200" width="240" height="96" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="500" y="240" fill="#1a1a1a" font-size="24" font-weight="700" text-anchor="middle">n8n JSON 임포트</text>
  <text x="500" y="272" fill="#6b6b6b" font-size="16" text-anchor="middle">SSH 자격증명 · 경로 2개만</text>

  <rect x="720" y="200" width="240" height="96" rx="6" fill="#f6f5f4"/>
  <rect x="720" y="200" width="240" height="96" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="840" y="240" fill="#1a1a1a" font-size="24" font-weight="700" text-anchor="middle">cron / launchd</text>
  <text x="840" y="272" fill="#6b6b6b" font-size="16" text-anchor="middle">run --from-gmail 15분마다</text>

  <!-- D2 diamond -->
  <polygon points="500,352 600,400 500,448 400,400" fill="#f6f5f4"/>
  <polygon points="500,352 600,400 500,448 400,400" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="500" y="408" fill="#1a1a1a" font-size="24" font-weight="700" text-anchor="middle">LLM 은?</text>

  <!-- row2 boxes -->
  <rect x="40" y="520" width="240" height="96" rx="6" fill="#f6f5f4"/>
  <rect x="40" y="520" width="240" height="96" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="160" y="560" fill="#1a1a1a" font-size="24" font-weight="700" text-anchor="middle">CLI 백엔드</text>
  <text x="160" y="592" fill="#6b6b6b" font-size="16" text-anchor="middle">claude · codex · gemini</text>

  <rect x="380" y="520" width="240" height="96" rx="6" fill="#f6f5f4"/>
  <rect x="380" y="520" width="240" height="96" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="500" y="560" fill="#1a1a1a" font-size="24" font-weight="700" text-anchor="middle">OpenRouter</text>
  <text x="500" y="592" fill="#6b6b6b" font-size="16" text-anchor="middle">OPENROUTER_API_KEY</text>

  <rect x="720" y="520" width="240" height="96" rx="6" fill="#f6f5f4"/>
  <rect x="720" y="520" width="240" height="96" rx="6" fill="rgba(26,26,26,0.02)" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="840" y="560" fill="#1a1a1a" font-size="24" font-weight="700" text-anchor="middle">끄기</text>
  <text x="840" y="592" fill="#6b6b6b" font-size="16" text-anchor="middle">룰 · 뱅샐 분류만으로</text>

  <!-- end (focal) -->
  <rect x="300" y="712" width="400" height="96" rx="6" fill="#f6f5f4"/>
  <rect x="300" y="712" width="400" height="96" rx="6" fill="rgba(37,99,235,0.08)" stroke="#2B4AC6" stroke-width="1"/>
  <text x="500" y="752" fill="#1a1a1a" font-size="24" font-weight="700" text-anchor="middle">결과는 어디서 보나</text>
  <text x="500" y="784" fill="#6b6b6b" font-size="16" text-anchor="middle">html · 메일 · Discord · hook · 에이전트 아티팩트</text>
</svg>
</div>
</body>
</html>
