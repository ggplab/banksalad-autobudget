# 귀속(attribution) 설정 — 결제수단별 기본 귀속 + 라벨 목록
#
# "이 지출이 누구(무엇) 소속인가"를 정한다. 개인만 쓰면 labels 를 [개인] 하나로 줄여도 된다.
# 사업자가 있으면 [개인, 사업, 불명] 처럼 늘리고, 사업용 카드·통장을 methods 에 적는다.
#
# 우선순위: 건별 오버라이드 > 가맹점 룰 > 여기(결제수단) > default
# 실제 파일은 rules/attribution.yaml 로 복사해 쓴다 (없으면 이 example 을 읽는다).

labels: [개인, 사업, 불명]
default: 불명

# 뱅샐 export 의 '결제수단' 컬럼 값을 그대로 키로 쓴다 (앱에 표시되는 계좌·카드 이름).
methods:
  "내 체크카드": 개인
  "생활비 통장": 개인
  "사업자 체크카드": 사업
  "사업자 통장": 사업
  "간편결제(포인트)": 불명
