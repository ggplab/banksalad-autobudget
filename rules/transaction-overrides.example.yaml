# 건별 판정 오버라이드 — 가장 센 신호. 가맹점 룰·결제수단 기본값·LLM 을 모두 덮는다.
#
# 왜 필요한가:
#   merchant_rules.yaml 은 가맹점명으로만 매칭한다. PG사 표기(NHNKCP·결제대행·이니시스…)는
#   같은 이름 아래 성격이 정반대인 거래가 섞이므로 가맹점 룰로 원리상 못 가른다.
#   사람이 개별 거래를 보고 내린 판정이라 어떤 자동 추정보다 근거가 강하다.
#
# 매칭 키: date + amount + content 부분문자열. 셋 다 일치해야 적용된다.
#   (id 를 안 쓰는 이유 — 사람이 읽고 고칠 수 없고, 재적재 시 바뀔 수 있다)
# note 는 필수다. 왜 그렇게 판정했는지가 없으면 1년 뒤 자신도 못 믿는다.
#
# 이 파일은 샘플이다 — 샘플 export(samples/sample-export.xlsx)의 행 하나를 가리킨다.

- match:
    date: "2026-03-14"
    amount: -128000
    content: "NHNKCP"
  purpose: "사업-접대"
  attribution: "사업"
  note: "거래처 식사. PG 표기라 룰로 못 가른다."
